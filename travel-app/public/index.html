<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://api-maps.yandex.ru/2.1/?apikey=956aaecb-f6bf-4905-9026-c77a0cbbdea2&lang=ru_RU" type="text/javascript"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Travel Booking</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Туры</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html" id="loginLink">Вход</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html" id="profileLink" style="display: none;">Профиль</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html" id="adminLink" style="display: none;">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="http://localhost:6868/api-docs" target="_blank">Swagger</a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link" id="balanceDisplay" style="display: none;">0 COIN</span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="text-center">Доступные туры</h1>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <input type="text" class="form-control" id="searchInput" placeholder="Поиск туров...">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="difficultyFilter">
                    <option value="">Все сложности</option>
                    <option value="1-3">Легкие (1-3)</option>
                    <option value="4-6">Средние (4-6)</option>
                    <option value="7-10">Сложные (7-10)</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary w-100" onclick="loadTours()">Применить фильтры</button>
            </div>
        </div>

        <div class="row" id="toursContainer">
            <!-- Tours will be loaded here -->
        </div>

        <!-- Карточка создания нового тура (только для admin) -->
        <div class="row" id="createTourRow" style="display:none;">
            <div class="col-md-4 mb-4 col-create">
                <div class="card h-100">
                    <div class="card-header">
                        <h5 class="card-title mb-0">➕ Создать новый тур</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-2">
                            <label class="form-label">Маршрут (ID)</label>
                            <input type="number" class="form-control" id="newTourRouteId" placeholder="ID маршрута" min="1">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Название</label>
                            <input type="text" class="form-control" id="newTourName" placeholder="Название тура">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Описание</label>
                            <input type="text" class="form-control" id="newTourDesc" placeholder="Описание">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Цена (COIN)</label>
                            <input type="number" class="form-control" id="newTourPrice" placeholder="Цена" min="1">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Макс. участников</label>
                            <input type="number" class="form-control" id="newTourMax" placeholder="Кол-во мест" min="1">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Дата начала</label>
                            <input type="date" class="form-control" id="newTourStart">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Дата окончания</label>
                            <input type="date" class="form-control" id="newTourEnd">
                        </div>
                        <button class="btn btn-primary w-100 mt-2" onclick="createNewTour()">Создать тур</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <section class="main-map-section mt-5">
        <div class="container">
            <h4 class="text-center mb-3" style="color: var(--text-burgundy);">🗺 Карта маршрутов</h4>
        </div>
        <div id="mainYandexMap" style="width:100%; height:420px;"></div>
    </section>

    <footer class="footer py-3">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Travel Booking System</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
